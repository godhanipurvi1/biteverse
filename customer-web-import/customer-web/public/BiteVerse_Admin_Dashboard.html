<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>BiteVerse Admin</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: sticky topbar, fixed sidebar (drawer on mobile), one content area that swaps views by hash: dashboard, orders, products, offers, profile. */
:root {
  --bg: #ffffff; --bar: #ffffff; --surface: #ffffff; --surface-2: #fff6ef; --ink: #161a22; --muted: #5b6370; --line: #ece6e0;
  --brand: #e85d0c; --brand-ink: #ffffff; --brand-soft: #ffeadb; --brand-text: #c2410c;
  --ok: #1a7f4b; --ok-soft: #dff1e6; --warn: #9a5b00; --warn-soft: #fbeccf; --bad: #b3261e; --bad-soft: #fbe3e1; --info: #2457c5; --info-soft: #e3ebfb;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --tb: 66px; --sbw: 252px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #100e0c; --bar: #171411; --surface: #1b1815; --surface-2: #241f1a; --ink: #f4efe9; --muted: #a79e94; --line: #2f2923;
    --brand: #ff7a33; --brand-ink: #1a0d03; --brand-soft: #3a2314; --brand-text: #ffa270;
    --ok: #55c58a; --ok-soft: #173325; --warn: #e7b25a; --warn-soft: #382a10; --bad: #f08a83; --bad-soft: #3b1b19; --info: #8fb0ff; --info-soft: #1a2547;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #100e0c; --bar: #171411; --surface: #1b1815; --surface-2: #241f1a; --ink: #f4efe9; --muted: #a79e94; --line: #2f2923;
  --brand: #ff7a33; --brand-ink: #1a0d03; --brand-soft: #3a2314; --brand-text: #ffa270;
  --ok: #55c58a; --ok-soft: #173325; --warn: #e7b25a; --warn-soft: #382a10; --bad: #f08a83; --bad-soft: #3b1b19; --info: #8fb0ff; --info-soft: #1a2547;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--bar); z-index: 60; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; cursor: pointer; }
input, select, textarea { font: inherit; color: var(--ink); }
:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; border-radius: 8px; }
.ic { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; background: var(--bar); border-bottom: 1px solid var(--line); }
.topbar .row { height: var(--tb); display: flex; align-items: center; gap: 10px; }
.iconbtn { width: 42px; height: 42px; border-radius: 12px; border: 0; background: transparent; display: grid; place-items: center; position: relative; }
.iconbtn:hover { background: var(--surface-2); }
.logo { font-family: var(--display); font-weight: 800; font-size: 24px; letter-spacing: -0.03em; white-space: nowrap; }
.logo b { color: var(--brand); font-weight: 800; }
.tag { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 4px 8px; border-radius: 6px; background: var(--brand-soft); color: var(--brand-text); }
.tsearch { display: none; flex: 1 1 260px; max-width: 420px; position: relative; margin-left: 12px; }
.tsearch input { width: 100%; height: 42px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2); padding: 0 16px 0 42px; }
.tsearch .ic { position: absolute; left: 14px; top: 11px; color: var(--muted); }
.spacer { flex: 1; }
.dotb { position: absolute; top: 9px; right: 10px; width: 9px; height: 9px; border-radius: 50%; background: var(--brand); border: 2px solid var(--bar); }
.avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--brand); color: var(--brand-ink); display: grid; place-items: center; font-weight: 700; font-size: 14px; }
.userbtn { display: flex; align-items: center; gap: 8px; height: 42px; padding: 0 12px 0 5px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); font-weight: 600; }
.userbtn span.nm { display: none; }
@media (min-width: 760px) { .userbtn span.nm { display: inline; } }
@media (min-width: 900px) { .tsearch { display: block; } }

.shell { display: grid; grid-template-columns: 1fr; }
.side { position: fixed; z-index: 70; top: 0; bottom: 0; left: 0; width: min(300px, 86vw); background: var(--bar); border-right: 1px solid var(--line); overflow-y: auto;
  padding: calc(16px + env(safe-area-inset-top, 0px)) 14px calc(16px + env(safe-area-inset-bottom, 0px)) max(14px, env(safe-area-inset-left, 0px));
  transform: translateX(-102%); transition: transform .25s; display: flex; flex-direction: column; gap: 16px; }
.shell.open .side { transform: none; }
.scrim { position: fixed; inset: 0; z-index: 65; background: rgba(10,8,6,.5); opacity: 0; pointer-events: none; transition: opacity .2s; }
.shell.open .scrim { opacity: 1; pointer-events: auto; }
.side .head { display: flex; align-items: center; justify-content: space-between; }
.side h4 { margin: 0 0 4px 12px; font-size: 11px; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); font-weight: 700; }
.nav { display: grid; gap: 2px; }
.nav a { display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; border-radius: 12px; font-weight: 600; color: var(--muted); position: relative; }
.nav a:hover { background: var(--surface-2); color: var(--ink); }
.nav a.on { background: var(--brand-soft); color: var(--brand-text); }
.nav a.on::before { content: ""; position: absolute; left: -8px; top: 11px; bottom: 11px; width: 4px; border-radius: 4px; background: var(--brand); }
.nav a.off { opacity: .55; cursor: default; }
.nav .pill { margin-left: auto; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--brand); color: var(--brand-ink); }
.nav .pill.soon { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
.sidefoot { margin-top: auto; padding: 14px; border-radius: 14px; background: var(--surface-2); font-size: 13px; color: var(--muted); }
.sidefoot b { display: block; color: var(--ink); font-size: 14px; margin-bottom: 2px; }
@media (min-width: 1024px) {
  .shell { grid-template-columns: var(--sbw) minmax(0, 1fr); }
  .side { position: sticky; z-index: 5; top: calc(var(--tb) + env(safe-area-inset-top, 0px)); height: calc(100vh - var(--tb) - env(safe-area-inset-top, 0px)); width: auto; transform: none; padding-top: 18px; }
  .side .head, .scrim { display: none; }
  .shell.collapsed { --sbw: 88px; }
  .shell.collapsed .lbl, .shell.collapsed .side h4, .shell.collapsed .promo, .shell.collapsed .nav .pill { display: none; }
  .shell.collapsed .nav a { justify-content: center; padding: 0; }
  .shell.collapsed .nav a.on::before { left: -6px; }
}
.shell { transition: grid-template-columns .25s ease; }
.nav a { height: 46px; gap: 14px; }
.promo { margin-top: auto; padding: 16px; border-radius: 16px; background: var(--brand); color: var(--brand-ink); display: grid; gap: 10px; overflow: hidden; position: relative; }
.promo p { margin: 0; font-weight: 600; font-size: 15px; line-height: 1.35; }
.promo a { justify-self: start; background: var(--brand-ink); color: var(--brand); padding: 8px 14px; border-radius: 999px; font-weight: 700; font-size: 14px; position: relative; z-index: 1; }
.promo .ring { position: absolute; right: -26px; bottom: -26px; width: 90px; height: 90px; border-radius: 50%; border: 14px solid rgba(255,255,255,.22); border-top-color: transparent; animation: spin 14s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

main { padding-block: 24px 64px; min-width: 0; }
.view { max-width: 1120px; margin-inline: auto; display: grid; gap: 20px; animation: up .35s ease both; }
@keyframes up { from { opacity: 0; transform: translateY(10px); } }
.pagehead { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px; }
h1 { font-family: var(--display); font-weight: 800; font-size: clamp(28px, 4vw, 38px); letter-spacing: -0.03em; line-height: 1.05; margin: 0; }
.sub { color: var(--muted); margin: 6px 0 0; }
h2 { font-family: var(--display); font-weight: 800; font-size: 20px; letter-spacing: -0.02em; margin: 0; }
.btn { height: 42px; padding: 0 18px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); font-weight: 700; display: inline-flex; align-items: center; gap: 8px; }
.btn:hover { border-color: var(--brand); color: var(--brand-text); }
.btn.pri { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); box-shadow: 0 8px 20px rgba(232,93,12,.25); }
.btn.pri:hover { color: var(--brand-ink); filter: brightness(1.06); }
.btn.sm { height: 34px; padding: 0 14px; font-size: 14px; }
.btn.danger { color: var(--bad); }
.btn.danger:hover { border-color: var(--bad); color: var(--bad); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 24px; min-width: 0; }
.card header { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }

.stats { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.stat { display: grid; gap: 4px; position: relative; }
.stat .lbl { color: var(--muted); font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 8px; }
.stat .lbl .ico { width: 34px; height: 34px; border-radius: 50%; background: var(--brand-soft); color: var(--brand); display: grid; place-items: center; }
.stat .val { font-family: var(--display); font-weight: 800; font-size: 32px; letter-spacing: -0.03em; line-height: 1.1; margin-top: 6px; font-variant-numeric: tabular-nums; }
.stat .delta { font-size: 13px; font-weight: 600; color: var(--ok); }
.stat .delta.neg { color: var(--bad); }
.grid2 { display: grid; gap: 20px; grid-template-columns: 1fr; }
@media (min-width: 960px) { .grid2 { grid-template-columns: 1.6fr 1fr; } }
.seg { display: inline-flex; padding: 3px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); }
.seg button { border: 0; background: transparent; padding: 6px 14px; border-radius: 999px; font-weight: 600; font-size: 13px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--brand); color: var(--brand-ink); }
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font: 500 11px var(--body); }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .bar { fill: var(--brand); opacity: .35; transition: opacity .15s; }
.chart .bar.hl, .chart .bar:hover { opacity: 1; }
.tipline { color: var(--muted); font-size: 13px; margin-top: 8px; min-height: 20px; }
.tipline b { color: var(--ink); }
.statusbar { display: flex; height: 14px; border-radius: 999px; overflow: hidden; gap: 2px; }
.statusbar i { display: block; }
.legend { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 8px; }
.legend li { display: flex; align-items: center; gap: 10px; font-size: 14px; }
.legend .sw { width: 10px; height: 10px; border-radius: 3px; }
.legend .n { margin-left: auto; font-weight: 700; font-variant-numeric: tabular-nums; }

.tw { overflow-x: auto; margin-inline: -4px; padding-inline: 4px; }
table { width: 100%; border-collapse: collapse; min-width: 620px; }
th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 700; padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 13px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
tbody tr.click { cursor: pointer; }
tbody tr.click:hover td { background: var(--surface-2); }
.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
.mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 13px; letter-spacing: .02em; }
.muted { color: var(--muted); }
.badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 700; white-space: nowrap; }
.badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.b-pending { background: var(--warn-soft); color: var(--warn); }
.b-confirmed, .b-preparing { background: var(--info-soft); color: var(--info); }
.b-ready, .b-out { background: var(--brand-soft); color: var(--brand-text); }
.b-delivered, .b-active { background: var(--ok-soft); color: var(--ok); }
.b-cancelled, .b-expired { background: var(--bad-soft); color: var(--bad); }
.b-paused, .b-off { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }

.tools { display: flex; flex-wrap: wrap; gap: 10px; }
.field { display: grid; gap: 6px; min-width: 0; }
.field label { font-size: 13px; font-weight: 600; color: var(--muted); }
.in, select.in, textarea.in { height: 42px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); padding: 0 12px; width: 100%; }
textarea.in { height: 80px; padding: 10px 12px; resize: vertical; }
.sbox { position: relative; flex: 1 1 240px; min-width: 0; }
.sbox .ic { position: absolute; left: 12px; top: 11px; color: var(--muted); }
.sbox .in { padding-left: 40px; border-radius: 999px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 14px; }
.chip:hover { border-color: var(--brand); }
.chip[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.empty { padding: 36px 12px; text-align: center; color: var(--muted); }

.switch { position: relative; width: 44px; height: 26px; border-radius: 999px; border: 0; background: var(--line); transition: background .2s; flex: none; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform .2s; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
.switch[aria-checked="true"] { background: var(--brand); }
.switch[aria-checked="true"]::after { transform: translateX(18px); }
.dish { display: flex; align-items: center; gap: 12px; min-width: 0; }
.dish .art { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; flex: none; font-size: 0; }
.dish .art svg { width: 28px; height: 28px; }
.dish b { display: block; }
.veg { width: 14px; height: 14px; border: 2px solid var(--ok); border-radius: 3px; display: inline-grid; place-items: center; vertical-align: -2px; margin-right: 6px; }
.veg::after { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--ok); }
.veg.nv { border-color: var(--bad); } .veg.nv::after { background: var(--bad); }

.formgrid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.formgrid .wide { grid-column: 1 / -1; }
.err { color: var(--bad); font-size: 13px; font-weight: 600; min-height: 18px; }

.overlay { position: fixed; inset: 0; z-index: 80; background: rgba(10,8,6,.5); opacity: 0; pointer-events: none; transition: opacity .2s; }
.overlay.show { opacity: 1; pointer-events: auto; }
.drawer { position: fixed; z-index: 85; top: 0; bottom: 0; right: 0; width: min(480px, 100vw); background: var(--surface); border-left: 1px solid var(--line); transform: translateX(104%); transition: transform .25s; overflow-y: auto;
  padding: calc(20px + env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) 20px; display: grid; gap: 18px; align-content: start; }
.drawer.show { transform: none; }
.dhead { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.kv { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; }
.kv dt { font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 700; }
.kv dd { margin: 2px 0 0; font-weight: 600; overflow-wrap: anywhere; }
.lines { list-style: none; margin: 0; padding: 0; }
.lines li { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.lines li.t { border-bottom: 0; font-weight: 700; border-top: 2px solid var(--ink); margin-top: 4px; }
.lines li.m { color: var(--muted); }
.flow { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.flow li { display: grid; grid-template-columns: 22px 1fr; gap: 12px; padding-bottom: 14px; position: relative; font-size: 14px; color: var(--muted); }
.flow li::before { content: ""; position: absolute; left: 10px; top: 22px; bottom: 0; width: 2px; background: var(--line); }
.flow li:last-child::before { display: none; }
.flow .d { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); z-index: 1; }
.flow li.done { color: var(--ink); } .flow li.done .d { background: var(--brand); border-color: var(--brand); }
.flow li.done::before { background: var(--brand); }
.flow li.now .d { border-color: var(--brand); box-shadow: 0 0 0 4px var(--brand-soft); }
.flow li.now { color: var(--ink); font-weight: 700; }
.act { display: flex; flex-wrap: wrap; gap: 10px; }
.cancelbox { display: grid; gap: 10px; padding: 14px; border-radius: 14px; background: var(--bad-soft); }

.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 24px); background: var(--ink); color: var(--bg); padding: 12px 18px; border-radius: 12px; font-weight: 600; font-size: 14px; opacity: 0; pointer-events: none; transition: .25s; z-index: 95; max-width: calc(100vw - 32px); }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.note { font-size: 13px; color: var(--muted); }
.qa { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.qa a { display: flex; align-items: center; gap: 10px; padding: 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface-2); font-weight: 700; transition: transform .15s, border-color .15s; }
.qa a:hover { transform: translateY(-3px); border-color: var(--brand); }
.qa .ic { color: var(--brand); }
.rank { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
.rank li { display: grid; gap: 6px; }
.rank .r1 { display: flex; justify-content: space-between; gap: 10px; font-weight: 600; }
.rank .track { height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.rank .track i { display: block; height: 100%; background: var(--brand); border-radius: 999px; }
.kicker { display: inline-flex; align-items: center; gap: 8px; padding: 9px 16px; border-radius: 999px; background: var(--brand-soft); color: var(--brand-text); font-weight: 600; }
.kicker .ic { width: 18px; height: 18px; }
.hero { display: grid; gap: 16px; padding-block: 8px 4px; }
.hero h1 { font-size: clamp(38px, 6vw, 64px); line-height: .98; letter-spacing: -0.035em; margin: 0; text-wrap: balance; }
.hero h1 span { display: block; color: var(--brand); }
.hero .lede { font-size: clamp(16px, 2vw, 19px); color: var(--muted); max-width: 52ch; margin: 0; }
.cta { height: 56px; padding: 0 28px; border-radius: 999px; border: 0; background: var(--brand); color: var(--brand-ink); font-weight: 700; font-size: 16px; display: inline-flex; align-items: center; gap: 10px; box-shadow: 0 12px 28px rgba(232,93,12,.3); transition: transform .15s; }
.cta:hover { transform: translateY(-2px); }
.cta.ghost { background: var(--surface); color: var(--ink); border: 1.5px solid var(--line); box-shadow: none; }
.cta.ghost:hover { border-color: var(--brand); color: var(--brand-text); }
.feats { display: grid; gap: 18px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
.feat { position: relative; padding: 28px; border-radius: 22px; border: 1px solid var(--line); background: var(--surface); display: grid; gap: 10px; transition: transform .2s, box-shadow .2s, border-color .2s; }
.feat:hover { transform: translateY(-6px); border-color: var(--brand); box-shadow: 0 20px 40px rgba(232,93,12,.14); }
.feat .fico { width: 76px; height: 76px; border-radius: 50%; background: var(--brand-soft); color: var(--brand); display: grid; place-items: center; transition: transform .3s; }
.feat:hover .fico { transform: rotate(-8deg) scale(1.06); }
.feat .fico .ic { width: 34px; height: 34px; }
.feat h3 { margin: 6px 0 0; font-family: var(--display); font-size: 28px; font-weight: 800; letter-spacing: -.02em; }
.feat p { margin: 0; color: var(--muted); }
.feat .go { font-weight: 700; color: var(--brand-text); }
.live { position: absolute; top: 20px; right: 20px; display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; background: var(--brand); color: var(--brand-ink); font-size: 14px; font-weight: 700; }

.scene { position: relative; width: 100%; max-width: 420px; margin-inline: auto; aspect-ratio: 420 / 320; }
.scene svg { width: 100%; height: 100%; display: block; overflow: visible; }
.scene .blob { fill: var(--brand-soft); transform-box: fill-box; transform-origin: center; animation: breathe 7s ease-in-out infinite; }

.scene .fl2 { animation: bob 5.5s -1.5s ease-in-out infinite; }
.scene .fl3 { animation: bob 3.6s -.8s ease-in-out infinite; }

    view.innerHTML = VIEWS[h]();
    $$(".nav a[data-v]").forEach(function (a) { a.classList.toggle("on", a.getAttribute("data-v") === h); });
    if (h === "dashboard") { drawChart(); startSwap(); } else stopSwap(); if (h === "orders") drawOrders(); if (h === "products") drawProducts(); if (h === "offers") drawOffers(); if (h === "payments") drawPayments(); if (h === "delivery") drawDelivery(); if (h === "reviews") drawReviews(); if (h === "customers") drawCustomers(); if (h === "analytics") drawAnalytics();
    if (fresh && !keepScroll) window.scrollTo(0, 0);
    document.title = "BiteVerse Admin";
    var pend = pendingNew; pendingNew = null; if (pend === "product") openProdForm(); if (pend === "offer") openOfferForm();
  }
  var pendingNew = null;
  window.addEventListener("hashchange", function () { setShell(false); route(); });

  /* ---------- Events ---------- */
  document.addEventListener("click", function (e) {
    var t = e.target;
    var n = t.closest("[data-new]"); if (n) pendingNew = n.getAttribute("data-new");
    var row = t.closest("[data-open]"); if (row) { openOrder(row.getAttribute("data-open")); return; }
    var r = t.closest("#rangeSeg [data-r]"); if (r) { state.range = r.getAttribute("data-r"); $$("#rangeSeg button").forEach(function (b) { b.setAttribute("aria-pressed", String(b === r)); }); drawChart(); return; }
    var f = t.closest("#ofilters [data-f]"); if (f) { state.ordFilter = f.getAttribute("data-f"); drawOrders(); return; }
    var pc = t.closest("#pcats [data-c]"); if (pc) { state.prodCat = pc.getAttribute("data-c"); drawProducts(); return; }
    var on = t.closest("[data-on]"); if (on) { var p = PRODUCTS.filter(function (x) { return x.id === +on.getAttribute("data-on"); })[0]; p.on = !p.on; on.setAttribute("aria-checked", String(p.on)); toast(p.name + (p.on ? " is available" : " is unavailable")); return; }
    var ft = t.closest("[data-feat]"); if (ft) { var q = PRODUCTS.filter(function (x) { return x.id === +ft.getAttribute("data-feat"); })[0]; q.feat = !q.feat; ft.setAttribute("aria-checked", String(q.feat)); return; }
    var ed = t.closest("[data-edit]"); if (ed) { openProdForm(+ed.getAttribute("data-edit")); $("#prodForm").scrollIntoView({ behavior: "smooth", block: "center" }); return; }
    var tg = t.closest("[data-tog]"); if (tg) { var o = OFFERS[+tg.getAttribute("data-tog")]; o.status = o.status === "active" ? "paused" : "active"; drawOffers(); toast(o.code + (o.status === "active" ? " activated" : " paused")); return; }
    var sw = t.closest("[data-sw]"); if (sw) { sw.setAttribute("aria-checked", String(sw.getAttribute("aria-checked") !== "true")); return; }
    if (t.closest("#addProd")) { openProdForm(); return; }
    if (t.closest("#addOffer")) { openOfferForm(); return; }
    if (t.closest("#csv")) { toast("CSV export needs your server. Not connected in preview."); return; }
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { closeDrawer(); setShell(false); }
    if ((e.key === "Enter" || e.key === " ") && e.target.matches && e.target.matches("tr[data-open]")) { e.preventDefault(); openOrder(e.target.getAttribute("data-open")); }
  });
  document.addEventListener("input", function (e) {
    if (e.target.id === "oq") { state.ordQ = e.target.value; drawOrders(); }
    if (e.target.id === "pq") { state.prodQ = e.target.value; drawProducts(); }
  });
  document.addEventListener("submit", function (e) {
    if (e.target.id === "prof") { e.preventDefault(); var m = $("#pr-mail").value.trim(); if (!$("#pr-name").value.trim()) { $("#prErr").textContent = "Enter your name."; return; } if (!/^\S+@\S+\.\S+$/.test(m)) { $("#prErr").textContent = "Enter a valid email address."; return; } $("#prErr").textContent = ""; toast("Profile saved"); }
  });
  $("#gsearch").addEventListener("submit", function (e) { e.preventDefault(); state.ordQ = $("#gq").value; state.ordFilter = "all"; if (location.hash === "#orders") route(true); else location.hash = "#orders"; });
  overlay.addEventListener("click", closeDrawer);
  $("#bellBtn").addEventListener("click", function () { var n = count("pending"); toast(n ? n + " pending " + (n === 1 ? "order needs" : "orders need") + " confirmation" : "No new notifications"); });

  var shell = $("#shell");
  function setShell(v) { shell.classList.toggle("open", v); $("#menuBtn").setAttribute("aria-expanded", String(v)); }
  var desk = window.matchMedia("(min-width: 1024px)");
  $$(".nav a").forEach(function (a) {
    a.childNodes.forEach(function (n) { if (n.nodeType === 3 && n.textContent.trim()) { var s = document.createElement("span"); s.className = "lbl"; s.textContent = n.textContent.trim(); a.replaceChild(s, n); a.title = s.textContent; } });
    a.addEventListener("click", function () { if (!desk.matches) setShell(false); });
  });
  $("#menuBtn").addEventListener("click", function () {
    if (desk.matches) { shell.classList.toggle("collapsed"); $("#menuBtn").setAttribute("aria-expanded", String(!shell.classList.contains("collapsed"))); }
    else { setShell(!shell.classList.contains("open")); }
  });
  $("#closeBtn").addEventListener("click", function () { setShell(false); });
  $("#scrim").addEventListener("click", function () { setShell(false); });

  function isDark() { var t = document.documentElement.getAttribute("data-theme"); return t ? t === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches; }
  function paintTheme() { $("#themeUse").setAttribute("href", isDark() ? "#i-sun" : "#i-moon"); }
  $("#themeBtn").addEventListener("click", function () { document.documentElement.setAttribute("data-theme", isDark() ? "light" : "dark"); paintTheme(); });
  paintTheme(); syncPills(); route();
})();
</script>

</body></html>
